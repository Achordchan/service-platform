name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-release:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build app
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public
          JOB_DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          BETTER_AUTH_SECRET: github-actions-build-secret-at-least-32-chars
          BETTER_AUTH_URL: https://support.achord.cn
          APP_URL: https://support.achord.cn
          NEXT_PUBLIC_APP_URL: https://support.achord.cn
          NODE_ENV: production
        run: pnpm build

      - name: Verify runtime dependencies
        run: pnpm verify:runtime-deps

      - name: Package release
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./node_modules' \
            --exclude='./.next/cache' \
            --exclude='./.next/dev' \
            --exclude='./.data' \
            --exclude='./public/uploads' \
            --exclude='./test-results' \
            --exclude='./playwright-report' \
            --exclude='./coverage' \
            --exclude='./.DS_Store' \
            --exclude='./tsconfig.tsbuildinfo' \
            -czf "${RUNNER_TEMP}/service-platform-release.tar.gz" .

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: service-platform-release-${{ github.sha }}
          path: ${{ runner.temp }}/service-platform-release.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  deploy:
    name: Deploy and health check
    needs: build-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v8
        with:
          name: service-platform-release-${{ github.sha }}
          path: ${{ runner.temp }}/release

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}"
          test -n "${VPS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "${PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          USER_NAME="${VPS_USER:-deploy}"
          PORT="${VPS_PORT:-22}"
          STAMP="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          REMOTE_DIR="/home/${USER_NAME}/releases/${STAMP}"
          ARCHIVE="${RUNNER_TEMP}/release/service-platform-release.tar.gz"

          test -f "${ARCHIVE}"
          ssh -i ~/.ssh/id_ed25519 -p "${PORT}" -o IdentitiesOnly=yes \
            "${USER_NAME}@${VPS_HOST}" "mkdir -p '${REMOTE_DIR}'"

          scp -i ~/.ssh/id_ed25519 -P "${PORT}" -o IdentitiesOnly=yes \
            "${ARCHIVE}" "${USER_NAME}@${VPS_HOST}:${REMOTE_DIR}/release.tar.gz"

          ssh -i ~/.ssh/id_ed25519 -p "${PORT}" -o IdentitiesOnly=yes \
            "${USER_NAME}@${VPS_HOST}" \
            "tar -xzf '${REMOTE_DIR}/release.tar.gz' -C '${REMOTE_DIR}' && rm '${REMOTE_DIR}/release.tar.gz'"

          ssh -i ~/.ssh/id_ed25519 -p "${PORT}" -o IdentitiesOnly=yes \
            "${USER_NAME}@${VPS_HOST}" "
              set -euo pipefail
              APP_DIR=/var/www/service-platform
              sudo /opt/service-platform/deploy.sh '${REMOTE_DIR}'
              cd \"\${APP_DIR}\"
              node scripts/verify-runtime-dependencies.mjs
            "

          ssh -i ~/.ssh/id_ed25519 -p "${PORT}" -o IdentitiesOnly=yes \
            "${USER_NAME}@${VPS_HOST}" \
            "ls -1dt /home/${USER_NAME}/releases/* 2>/dev/null | tail -n +4 | xargs -r rm -rf"

      - name: Health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          URL="${APP_URL:-https://support.achord.cn}/login"
          for i in 1 2 3 4 5 6 7 8; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${URL}" || true)"
            if [[ "${CODE}" == "200" ]]; then
              echo "health ok: ${URL} -> ${CODE}"
              exit 0
            fi
            echo "attempt ${i}: ${CODE}"
            sleep 4
          done
          echo "health check failed for ${URL}" >&2
          exit 1
