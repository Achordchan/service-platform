name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "${VPS_HOST}"
          test -n "${VPS_SSH_KEY}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "${PORT}" -H "${VPS_HOST}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Upload release and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          USER_NAME="${VPS_USER:-deploy}"
          PORT="${VPS_PORT:-22}"
          STAMP="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA:0:7}"
          REMOTE_DIR="/home/${USER_NAME}/releases/${STAMP}"

          ssh -i ~/.ssh/id_ed25519 -p "${PORT}" -o IdentitiesOnly=yes \
            "${USER_NAME}@${VPS_HOST}" "mkdir -p '${REMOTE_DIR}'"

          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -p ${PORT} -o IdentitiesOnly=yes" \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env.*' \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude '.data/' \
            --exclude 'public/uploads/' \
            --exclude 'test-results/' \
            --exclude 'playwright-report/' \
            --exclude 'coverage/' \
            --exclude '.DS_Store' \
            ./ "${USER_NAME}@${VPS_HOST}:${REMOTE_DIR}/"

          ssh -i ~/.ssh/id_ed25519 -p "${PORT}" -o IdentitiesOnly=yes \
            "${USER_NAME}@${VPS_HOST}" "sudo /opt/service-platform/deploy.sh '${REMOTE_DIR}'"

          ssh -i ~/.ssh/id_ed25519 -p "${PORT}" -o IdentitiesOnly=yes \
            "${USER_NAME}@${VPS_HOST}" "ls -1dt /home/${USER_NAME}/releases/* 2>/dev/null | tail -n +6 | xargs -r rm -rf"

      - name: Health check
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          set -euo pipefail
          URL="${APP_URL:-https://support.achord.cn}/login"
          for i in 1 2 3 4 5; do
            CODE="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "${URL}" || true)"
            if [[ "${CODE}" == "200" ]]; then
              echo "health ok: ${URL} -> ${CODE}"
              exit 0
            fi
            echo "attempt ${i}: ${CODE}"
            sleep 3
          done
          echo "health check failed for ${URL}" >&2
          exit 1
