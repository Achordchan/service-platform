# server {} context only (the HTTPS vhost that fronts support.achord.cn)
# Keep these exact locations ahead of the broader application proxy location.
location = /api/v1/integrations/universal/launch-tickets {
    client_max_body_size 64k;
    proxy_pass http://service_platform;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /api/v1/embed/universal/exchange {
    client_max_body_size 64k;
    proxy_pass http://service_platform;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
