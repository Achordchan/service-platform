# server {} context only (the HTTPS vhost that fronts support.achord.cn)
# Keep this location ahead of broader proxy locations.
location ^~ /embed/sub2api/ {
    access_log /var/log/nginx/sub2api_embed.access.log main_no_args;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
